{% extends "base.html" %}

{% block content %}
    <h2>{{ recipe.name }}</h2>
    <p>by {{ recipe.author.name }}</p>
    <h3>Ingredients:</h3>
    <ul>
        {% for ingredient in recipe.ingredients.all %}
            <li>{{ ingredient.ingredient.name }} - {{ ingredient.quantity }}</li>
        {% endfor %}
    </ul>
{% endblock %}
