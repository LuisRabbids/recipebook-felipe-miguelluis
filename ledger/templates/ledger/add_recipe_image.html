{% extends "base.html" %}

{% block page_title %}Add Recipe Image{% endblock %}

{% block content %}
    <h2>Upload an Image for "{{ recipe.name }}"</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Upload">
    </form>
    <a href="{% url 'ledger:recipe-detail' recipe.pk %}">Back to Recipe</a>
{% endblock %}
