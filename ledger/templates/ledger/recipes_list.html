{% extends "base.html" %}

{% block page_title %}Recipe List{% endblock %}

{% block content %}
    <h2>Recipes</h2>
    <a href="{% url 'ledger:add-recipe' %}">Add New Recipe</a>
    <ul>
        {% for recipe in recipes %}
            <li>
                <a href="{% url 'ledger:recipe_detail' recipe.id %}">{{ recipe.name }}</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
