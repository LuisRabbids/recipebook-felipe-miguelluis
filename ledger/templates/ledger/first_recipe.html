<!DOCTYPE html>
<html lang="en">
<body>
    <header>
        <h1>Recipe Book</h1>
    </header>
    <main>
        <h2>{{ name }}</h2>
        <h3>Ingredients:</h3>
        <ul>
            {% for ingredient in ingredients %}
                <li>{{ ingredient.name }} - {{ ingredient.quantity }}</li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>
